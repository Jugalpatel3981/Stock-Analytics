name: Model Backtest

# Run manually from the Actions tab. Downloads fresh prices, runs the walk-forward
# backtest and commits the updated report to docs/model-performance.md.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated tickers"
        required: false
        default: "AAPL MSFT NVDA TSLA AMZN GOOGL META JPM"

permissions:
  contents: write

jobs:
  backtest:
    name: Walk-forward backtest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: python -m app.ml.backtest --symbols $SYMBOLS --output ../docs/model-performance.md

      - name: Commit report
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/model-performance.md
          git diff --cached --quiet || git commit -m "Update model performance report"
          git push
